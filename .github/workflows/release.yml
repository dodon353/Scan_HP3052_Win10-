name: Windows build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hp3052-release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.426'
      - name: Run model, Windows image and installer checks
        run: ./tests/Run-Tests.ps1
      - name: Publish standalone Windows executable
        run: |
          dotnet publish src/HP3052Scanner.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -warnaserror -o dist/publish
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
      - name: Package program, instructions, licenses and optional sources
        run: |
          python tools/package-release.py
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed.' }
      - name: Publish version 0.7.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v0.7.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Release v0.7.0 already exists; keeping its published assets.'
            exit 0
          }
          gh release create v0.7.0 dist/HP3052Scanner_v0.7.0_Windows_x64.zip dist/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'HP 3052 Scanner 0.7.0 — Windows x64' --notes-file docs/RELEASE-v0.7.0.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
